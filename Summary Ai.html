<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocuBrief AI - Smart Client-Side PDF Summarizer</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* NAVBAR */
    .navbar {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 19px;
      font-weight: 700;
      color: #38bdf8;
    }
    .badge {
      font-size: 12px;
      background: #0369a1;
      color: #e0f2fe;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
    }

    /* MAIN LAYOUT */
    .app-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      flex: 1;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 24px;
      gap: 24px;
    }

    /* SIDEBAR (LOCAL HISTORY) */
    .sidebar {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      height: calc(100vh - 130px);
    }
    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #334155;
    }
    .sidebar-header h3 {
      font-size: 15px;
      color: #f1f5f9;
    }
    .clear-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 12px;
      cursor: pointer;
    }
    .clear-btn:hover {
      color: #f87171;
    }
    .history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .history-item {
      background: #0f172a;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .history-item:hover {
      border-color: #38bdf8;
    }
    .history-item-title {
      font-size: 13px;
      font-weight: 600;
      color: #f8fafc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }
    .history-item-time {
      font-size: 11px;
      color: #64748b;
    }

    /* MAIN CONSOLE */
    .console {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      height: calc(100vh - 130px);
    }
    .upload-area {
      border: 2px dashed #475569;
      border-radius: 12px;
      padding: 32px 20px;
      text-align: center;
      cursor: pointer;
      background: #0f172a;
      transition: all 0.2s;
    }
    .upload-area:hover {
      border-color: #38bdf8;
      background: #131c31;
    }
    .upload-area input {
      display: none;
    }
    .upload-title {
      font-size: 15px;
      font-weight: 600;
      margin-top: 10px;
    }
    .upload-subtitle {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 4px;
    }
    .btn-action {
      background: #0284c7;
      color: #ffffff;
      border: none;
      padding: 13px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
      transition: background 0.2s;
    }
    .btn-action:hover {
      background: #0369a1;
    }
    .btn-action:disabled {
      background: #475569;
      cursor: not-allowed;
    }
    .status-badge {
      font-size: 13px;
      text-align: center;
      margin-top: 12px;
      color: #94a3b8;
    }

    /* SUMMARY RESULT */
    .result-wrapper {
      margin-top: 24px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 20px;
      display: none;
    }
    .result-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1e293b;
    }
    .toolbar-actions {
      display: flex;
      gap: 8px;
    }
    .tool-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 6px;
      cursor: pointer;
    }
    .tool-btn:hover {
      background: #334155;
      color: #fff;
    }
    .summary-content {
      font-size: 14.5px;
      line-height: 1.7;
      white-space: pre-wrap;
      color: #e2e8f0;
    }

    @media (max-width: 900px) {
      .app-layout {
        grid-template-columns: 1fr;
      }
      .sidebar {
        height: auto;
      }
      .console {
        height: auto;
      }
    }
  </style>
</head>
<body>

  <!-- TOPBAR -->
  <nav class="navbar">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
      DocuBrief AI
    </div>
    <span class="badge">Client-Side Serverless</span>
  </nav>

  <!-- MAIN APP -->
  <div class="app-layout">
    
    <!-- LEFT SIDEBAR: CLIENT-SIDE HISTORY -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h3>লোকাল হিস্ট্রি (Local Storage)</h3>
        <button class="clear-btn" id="clearHistoryBtn">মুছে ফেলুন</button>
      </div>
      <div class="history-list" id="historyContainer">
        <p style="font-size: 12px; color: #64748b; text-align: center; margin-top: 30px;">কোনো হিস্ট্রি পাওয়া যায়নি</p>
      </div>
    </aside>

    <!-- RIGHT MAIN CONSOLE -->
    <main class="console">
      <label class="upload-area" for="pdfInput">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="1.8"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
        <div class="upload-title" id="fileTitle">PDF ফাইল আপলোড করতে এখানে ক্লিক করুন</div>
        <div class="upload-subtitle">বড় বই, অফিশিয়াল ডকুমেন্ট বা স্ক্যান করা যেকোনো PDF ফাইল গ্রহণযোগ্য</div>
        <input type="file" id="pdfInput" accept="application/pdf">
      </label>

      <button class="btn-action" id="summarizeBtn" disabled>সারসংক্ষেপ তৈরি করুন</button>
      <div class="status-badge" id="statusBox"></div>

      <div class="result-wrapper" id="resultWrapper">
        <div class="result-toolbar">
          <h4 style="font-size: 15px; color: #38bdf8;">সারসংক্ষেপ (Summary)</h4>
          <div class="toolbar-actions">
            <button class="tool-btn" id="copyBtn">কপি করুন</button>
            <button class="tool-btn" id="downloadBtn">ডাউনলোড (.txt)</button>
          </div>
        </div>
        <div class="summary-content" id="summaryBox"></div>
      </div>
    </main>

  </div>

  <script>
    const API_KEY = "AIzaSyDcRuA5rPVVg5QuLAwM-bSBgnmwsxzEQYw";
    
    // আপনার প্রজেক্টের সক্রিয় ফ্রি মডেল তালিকা
    const ACTIVE_MODELS = [
      "gemini-3.6-flash",
      "gemini-2.5-flash",
      "gemini-2.5-flash-lite"
    ];

    const pdfInput = document.getElementById("pdfInput");
    const fileTitle = document.getElementById("fileTitle");
    const summarizeBtn = document.getElementById("summarizeBtn");
    const statusBox = document.getElementById("statusBox");
    const resultWrapper = document.getElementById("resultWrapper");
    const summaryBox = document.getElementById("summaryBox");
    const historyContainer = document.getElementById("historyContainer");
    const clearHistoryBtn = document.getElementById("clearHistoryBtn");
    const copyBtn = document.getElementById("copyBtn");
    const downloadBtn = document.getElementById("downloadBtn");

    let selectedFile = null;

    // ফাইল নির্বাচন
    pdfInput.addEventListener("change", (e) => {
      if (e.target.files.length > 0) {
        selectedFile = e.target.files[0];
        fileTitle.innerText = `${selectedFile.name} (${(selectedFile.size / (1024 * 1024)).toFixed(2)} MB)`;
        summarizeBtn.disabled = false;
        resultWrapper.style.display = "none";
        statusBox.innerText = "";
      }
    });

    // File to Base64
    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = (err) => reject(err);
      });
    }

    // Gemini API Call
    async function requestGemini(model, base64Data) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${API_KEY}`;
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{
            parts: [
              { text: "দয়া করে এই PDF সম্পূর্ণ পড়ুন এবং এর মূল তথ্য ও গুরুত্বপূর্ণ সিদ্ধান্তগুলো বাংলায় পরিষ্কার বুলেট পয়েন্ট আকারে একটি সুনির্দিষ্ট সারসংক্ষেপ উপস্থাপন করুন।" },
              { inline_data: { mime_type: "application/pdf", data: base64Data } }
            ]
          }]
        })
      });
      return await response.json();
    }

    // Summarize Action
    summarizeBtn.addEventListener("click", async () => {
      if (!selectedFile) return;

      // ব্রাউজার ক্যাশে চেক (একই ফাইল হলে API কল করবে না)
      const cacheKey = `pdf_${selectedFile.name}_${selectedFile.size}`;
      const cachedSummary = localStorage.getItem(cacheKey);

      if (cachedSummary) {
        displaySummary(cachedSummary);
        statusBox.innerText = "ক্যাশে থেকে তাৎক্ষণিকভাবে লোড করা হয়েছে!";
        return;
      }

      try {
        summarizeBtn.disabled = true;
        statusBox.innerText = "PDF এনকোড করা হচ্ছে...";

        const base64Data = await fileToBase64(selectedFile);
        let finalResult = null;
        let lastError = null;

        for (const model of ACTIVE_MODELS) {
          statusBox.innerText = `Gemini (${model}) দিয়ে সারসংক্ষেপ তৈরি হচ্ছে...`;
          const data = await requestGemini(model, base64Data);

          if (data.error) {
            lastError = data.error.message;
            continue;
          }

          const txt = data.candidates?.[0]?.content?.parts?.[0]?.text;
          if (txt) {
            finalResult = txt;
            break;
          }
        }

        if (finalResult) {
          displaySummary(finalResult);
          saveToHistory(selectedFile.name, finalResult, cacheKey);
          statusBox.innerText = "সারসংক্ষেপ সফলভাবে তৈরি হয়েছে!";
        } else {
          statusBox.innerText = "ভুল হয়েছে: " + (lastError || "মডেল ব্যস্ত আছে, কিছুক্ষণ পর চেষ্টা করুন।");
        }
      } catch (err) {
        statusBox.innerText = "ভুল হয়েছে: " + err.message;
      } finally {
        summarizeBtn.disabled = false;
      }
    });

    function displaySummary(text) {
      summaryBox.innerText = text;
      resultWrapper.style.display = "block";
    }

    // Local Storage History Management
    function saveToHistory(filename, summary, cacheKey) {
      localStorage.setItem(cacheKey, summary);

      let history = JSON.parse(localStorage.getItem("docubrief_history") || "[]");
      history.unshift({
        name: filename,
        summary: summary,
        date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });

      if (history.length > 20) history.pop();
      localStorage.setItem("docubrief_history", JSON.stringify(history));
      renderHistory();
    }

    function renderHistory() {
      const history = JSON.parse(localStorage.getItem("docubrief_history") || "[]");
      if (history.length === 0) {
        historyContainer.innerHTML = '<p style="font-size: 12px; color: #64748b; text-align: center; margin-top: 30px;">কোনো হিস্ট্রি পাওয়া যায়নি</p>';
        return;
      }

      historyContainer.innerHTML = "";
      history.forEach(item => {
        const div = document.createElement("div");
        div.className = "history-item";
        div.innerHTML = `
          <div class="history-item-title">${item.name}</div>
          <div class="history-item-time">${item.date}</div>
        `;
        div.onclick = () => displaySummary(item.summary);
        historyContainer.appendChild(div);
      });
    }

    clearHistoryBtn.addEventListener("click", () => {
      localStorage.removeItem("docubrief_history");
      renderHistory();
    });

    // Copy to Clipboard
    copyBtn.addEventListener("click", () => {
      navigator.clipboard.writeText(summaryBox.innerText).then(() => {
        const oldText = copyBtn.innerText;
        copyBtn.innerText = "কপি হয়েছে!";
        setTimeout(() => copyBtn.innerText = oldText, 2000);
      });
    });

    // Download as .txt
    downloadBtn.addEventListener("click", () => {
      const blob = new Blob([summaryBox.innerText], { type: "text/plain;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `Summary_${Date.now()}.txt`;
      a.click();
    });

    // Initial load
    renderHistory();
  </script>
</body>
</html>
